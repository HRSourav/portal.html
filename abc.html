<!DOCTYPE html>
<html>
<head>
  <title>RightO Careers Portal</title>

  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg,#e3ecff,#f5f7fb);
      margin:0;
    }

    .container {
      width:420px;
      margin:50px auto;
      background:white;
      padding:25px;
      border-radius:12px;
    }

    .logo {
      text-align:center;
      margin-bottom:15px;
    }

    .logo img {
      width:140px;
    }

    h2 { text-align:center; }

    input, select, textarea {
      width:100%;
      padding:10px;
      margin:8px 0;
    }

    button {
      width:100%;
      padding:12px;
      background:#4b3cff;
      color:white;
      border:none;
    }

    .whatsapp {
      background:#25D366;
      margin-top:10px;
    }
  </style>
</head>

<body>

<div class="container">

<div class="logo">
  <img src="./logo.png">
</div>

<h2>Apply for Jobs</h2>

<form onsubmit="submitForm(event)">

<select id="job" required>
  <option value="">Select Job Role</option>
  <option>BPO Executive - Mohali</option>
  <option>Chat Support - Gurgaon</option>
  <option>Work From Home</option>
</select>

<input type="text" id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="text" id="phone" placeholder="Phone" required>
<input type="text" id="altphone" placeholder="Alternate Phone">
<input type="text" id="aadhaar" placeholder="Aadhaar (Optional)">
<input type="text" id="qualification" placeholder="Qualification" required>

<textarea id="address" placeholder="Address"></textarea>

<button type="submit">Apply Now</button>

</form>

<a href="https://wa.me/919876543210" target="_blank">
  <button class="whatsapp">Chat on WhatsApp</button>
</a>

</div>

<script>
function submitForm(e) {
  e.preventDefault();

  let data = {
    job: document.getElementById("job").value,
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    phone: document.getElementById("phone").value,
    altphone: document.getElementById("altphone").value,
    aadhaar: document.getElementById("aadhaar").value,
    qualification: document.getElementById("qualification").value,
    address: document.getElementById("address").value
  };

  fetch("https://script.google.com/macros/s/AKfycbx_Ji8KbkhRXBBUIIHApRhbTTys_-PW96F_JPlODv-s6gjSJRjLjcyoI3vFNZo-4tRf/exec", {
    method:"POST",
    body:JSON.stringify(data)
  });

  alert("Application Submitted");
}
</script>

</body>
</html>
